apiVersion: batch/v1
kind: Job
metadata:
  name: myjob
spec:
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
        - name: migration
          image: busybox
          command: ["sh", "-c", "echo 'Migration data...' && sleep 10 && echo 'Data migration complete'"]
      restartPolicy: OnFailure