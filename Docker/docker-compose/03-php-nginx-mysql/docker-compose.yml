version: '3'
services:
  web:
    container_name: php_app
    build: .
    volumes:
      - ./app:/var/www/html
    networks:
      - app_network
    
  db:
    container_name: mysql_db
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  nginx:
    container_name: nginx_webserver
    image: nginx
    volumes:
      - ./app:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - web
      - db
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network: